; Reedus Lite standalone firmware: XIAO ESP32S3 on the reSpeaker XVF3800, talking to the cloud relay.
;   pio run -t upload && pio device monitor
; espressif32 6.x = Arduino core 2.0.x (ESP-IDF 4.4), which still has the legacy I2S
; driver this uses for full duplex.

[env:reedus_lite_s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; esptool's flasher stub loses this XIAO's native USB link right after it starts ("No serial
; data received"); the chip's own ROM loader works every time, just slower
upload_speed = 115200
upload_flags = --no-stub
monitor_echo = yes
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
; the "Reedus" wake word (src/wake.cpp): tools/embed_wake_model.py turns this .tflite and its
; .json manifest into wake_model.h before every build
custom_wake_model = ../wakeword/models/reedus.tflite
extra_scripts = pre:tools/embed_wake_model.py
; TFLite Micro (ESP_TF) needs C++17; ESP_NN + CONFIG_NN_OPTIMIZED + ARCH_ESP32_S3 pick
; Espressif's S3 assembly kernels for conv / depthwise / fully connected
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DESP_NN
    -DCONFIG_NN_OPTIMIZED
    -DARCH_ESP32_S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DFASTLED_RMT_MAX_CHANNELS=1
    ; XVF3800 is on Seeed's factory I2S firmware 1.0.4 (pre-dates the 48 kHz master build): XIAO clocks 16 kHz.
    ; Delete this line after flashing respeaker_xvf3800_i2s_master_v1.0.9_48k.bin.
    -DXVF_I2S_MASTER_48K=0
lib_deps =
    fastled/FastLED@3.7.8
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.2.1
    nickjgniklu/ESP_TF@2.1.1
