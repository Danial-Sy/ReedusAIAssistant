; Reedus Lite firmware: XIAO ESP32S3 on the reSpeaker XVF3800.
;   pio run -t upload && pio device monitor
; espressif32 6.x = Arduino core 2.0.x (ESP-IDF 4.4), which still has the legacy I2S
; driver this uses for full duplex.

[env:reedus_lite]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DFASTLED_RMT_MAX_CHANNELS=1
lib_deps =
    fastled/FastLED@3.7.8
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.2.1
